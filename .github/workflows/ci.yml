name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Lockfile uv à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv lock --check

  notebooks:
    name: Tests et notebooks dans Docker
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Même image que docker-compose.yml (eagle1-autopilot), avec cache GitHub Actions
      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: eagle1-autopilot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tests de l'API (dont le critère du cahier des charges : moyenne ≥ 200)
      - name: Tests de l'API
        run: docker compose run --rm --no-deps jupyter uv run --no-sync pytest -q

      # Échoue si une cellule lève une exception
      - name: Exécuter les notebooks (exercices + mission)
        run: >
          docker compose run --rm --no-deps jupyter
          uv run --no-sync jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=1800 --output-dir executed 'notebooks/*.ipynb'

      - name: Publier les notebooks exécutés, les modèles et les visuels
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebooks-executes
          path: |
            executed/
            models/
            media/
          if-no-files-found: warn
